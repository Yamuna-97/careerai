# alembic.ini — Alembic configuration for CareerAI Backend

[alembic]
# Path to the alembic directory containing env.py and migrations
script_location = alembic

# File naming pattern for migration versions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for generated migration file timestamps
timezone = UTC

# Max length of the "slug" in migration filenames
truncate_slug_length = 40

# Allow revision not found to not raise an error
revision_environment = false

# Whether to use "effective" rather than "expiration" for version identifiers
sourceless = false

# Version location (directory where migration files live)
version_locations = %(here)s/alembic/versions

# SQLAlchemy URL — overridden by env.py from .env file
sqlalchemy.url = postgresql+psycopg://placeholder

[post_write_hooks]
# Post-write hooks for auto-formatting migration files (optional)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
